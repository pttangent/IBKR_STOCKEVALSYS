name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research skill
        run: python -m compileall -q skill
      - name: Research skill unit tests
        working-directory: skill
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile radar modules
        run: python -m compileall -q ibkr-mcp/radar ibkr-mcp/run_radar.py
      - name: Radar pure-core unit tests
        working-directory: ibkr-mcp
        run: python -m unittest discover -s radar/tests -p 'test_*.py'
      - name: Install pinned radar runtime
        run: python -m pip install --disable-pip-version-check 'ib-async==2.0.1'
      - name: Radar runtime import smoke
        working-directory: ibkr-mcp
        run: python -c "from radar.engine import RadarEngine; from radar.service import main"
      - name: Radar UI JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('ibkr-mcp/radar/ui/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*?)</script>', html, re.S)
          assert match, 'missing inline radar script'
          pathlib.Path('/tmp/radar-ui.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/radar-ui.js
